name: Poll Hetzner

on:
  schedule:
    # Every 5 minutes. For a private repository, raise to "*/30 * * * *" (run minutes).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = only show availability (free), create = create the server"
        type: choice
        default: check
        options:
          - check
          - create

permissions:
  contents: read
  actions: write # required so the workflow can disable itself after success

concurrency:
  group: poll-hetzner
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Poll Hetzner and create server if available
        id: poll
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SSH_KEY_NAME: ${{ vars.SSH_KEY_NAME }}
          MODE: ${{ github.event.inputs.mode || 'create' }}
        run: python3 poll_hetzner.py

      - name: Disable workflow once a server exists
        if: steps.poll.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable poll-hetzner.yml --repo "$GITHUB_REPOSITORY"
